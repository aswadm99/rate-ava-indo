<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox OAuth Login</title>
<style>
:root{color-scheme:dark;--bg:#100d1c;--card:#1d1730;--purple:#a78bfa;--pink:#f0abfc;--text:#f7f3ff;--muted:#bcb2d1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#4c1d95 0,transparent 35%),radial-gradient(circle at 90% 90%,#701a75 0,transparent 30%),var(--bg);font:16px system-ui;color:var(--text)}
main{width:min(100%,460px);background:#1d1730eF;border:1px solid #ffffff20;border-radius:28px;padding:30px;box-shadow:0 24px 80px #0008}
.logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--pink));font-size:28px;font-weight:900;color:#20132d}
h1{margin:18px 0 8px;font-size:28px}p{color:var(--muted);line-height:1.55}.field{margin:18px 0}label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #ffffff24;background:#110e1c;color:white;font:inherit;outline:none}input:focus{border-color:var(--purple)}button{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(100deg,#8b5cf6,#d946ef);color:white;font:700 16px system-ui;cursor:pointer;margin-top:8px}button:disabled{opacity:.6;cursor:wait}.status{margin-top:18px;padding:12px;border-radius:12px;background:#ffffff0a;color:var(--muted);font-size:13px;word-break:break-word}.profile{display:none;margin-top:18px;padding:14px;border:1px solid #ffffff20;border-radius:16px}.profile img{width:64px;height:64px;border-radius:50%;background:#ffffff10}.profile a{color:#d8b4fe}.small{font-size:12px;margin-top:20px}
</style>
</head>
<body><main>
<div class="logo">R</div>
<h1>Login with Roblox</h1>
<p>Masuk dengan aman menggunakan akun Roblox. Website ini menggunakan OAuth 2.0 Authorization Code + PKCE.</p>
<div class="field"><label for="client">Roblox OAuth Client ID</label><input id="client" placeholder="Masukkan Client ID aplikasi Roblox" autocomplete="off"></div>
<button id="login">Login with Roblox</button>
<div id="status" class="status">Masukkan Client ID lalu tekan Login.</div>
<div id="profile" class="profile"><img id="avatar" alt="Avatar Roblox"><h3 id="display"></h3><p id="username"></p><p><a id="profilelink" target="_blank" rel="noopener">Lihat profil Roblox</a></p></div>
<p class="small">Jangan masukkan Client Secret ke website ini. Untuk aplikasi browser publik, gunakan PKCE.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const REDIRECT_URI=location.origin+location.pathname;
const AUTH="https://apis.roblox.com/oauth/v1/authorize";
const TOKEN="https://apis.roblox.com/oauth/v1/token";
const USERINFO="https://apis.roblox.com/oauth/v1/userinfo";
function b64url(bytes){return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function randomString(n=64){const a=new Uint8Array(n);crypto.getRandomValues(a);return b64url(a)}
async function challenge(v){return b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)))}
function setStatus(t){$("status").textContent=t}
$("login").addEventListener("click",async()=>{
 const client=$("client").value.trim();if(!client){setStatus("Masukkan Client ID terlebih dahulu.");return}
 try{
  const verifier=randomString(64),state=randomString(32),ch=await challenge(verifier);
  sessionStorage.setItem("roblox_pkce_verifier",verifier);sessionStorage.setItem("roblox_oauth_state",state);
  sessionStorage.setItem("roblox_client_id",client);
  const u=new URL(AUTH);u.searchParams.set("client_id",client);u.searchParams.set("redirect_uri",REDIRECT_URI);
  u.searchParams.set("scope","openid profile");u.searchParams.set("response_type","code");
  u.searchParams.set("code_challenge",ch);u.searchParams.set("code_challenge_method","S256");u.searchParams.set("state",state);
  location.href=u.toString();
 }catch(e){setStatus("Tidak dapat memulai login: "+e.message)}
});
(async()=>{
 const params=new URLSearchParams(location.search),code=params.get("code"),state=params.get("state"),error=params.get("error");
 if(error){setStatus("Login ditolak: "+(params.get("error_description")||error));return}
 if(!code)return;
 $("login").disabled=true;setStatus("Menyelesaikan login Roblox...");
 const expected=sessionStorage.getItem("roblox_oauth_state"),verifier=sessionStorage.getItem("roblox_pkce_verifier"),client=sessionStorage.getItem("roblox_client_id");
 if(!expected||!state||state!==expected||!verifier||!client){setStatus("State/verifier tidak cocok atau sesi browser hilang. Coba login ulang.");$("login").disabled=false;return}
 try{
  const body=new URLSearchParams({grant_type:"authorization_code",client_id:client,code,redirect_uri:REDIRECT_URI,code_verifier:verifier});
  const res=await fetch(TOKEN,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});
  const data=await res.json();if(!res.ok)throw new Error(data.error_description||data.error||"Token exchange gagal");
  const userRes=await fetch(USERINFO,{headers:{Authorization:"Bearer "+data.access_token}});
  const user=await userRes.json();if(!userRes.ok)throw new Error(user.error||"Gagal mengambil profil");
  $("profile").style.display="block";$("display").textContent=user.name||user.nickname||"Roblox user";
  $("username").textContent="@"+(user.preferred_username||"");$("profilelink").href=user.profile||"https://www.roblox.com/users/"+user.sub+"/profile";
  if(user.picture)$("avatar").src=user.picture;
  setStatus("Berhasil login! User ID: "+user.sub);
 }catch(e){setStatus("Login gagal: "+e.message+". Jika error CORS, gunakan backend/Cloudflare Worker untuk pertukaran token.")}
 finally{sessionStorage.removeItem("roblox_pkce_verifier");sessionStorage.removeItem("roblox_oauth_state");history.replaceState({},document.title,REDIRECT_URI);$("login").disabled=false}
})();
</script></body></html>
